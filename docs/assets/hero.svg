<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="EzyMap ALGO - signals, macro and autopilot, delivered on Telegram">
  <title>EzyMap ALGO - signals, macro and autopilot, delivered on Telegram</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1613"/>
      <stop offset="55%" stop-color="#0a0c0b"/>
      <stop offset="100%" stop-color="#12100a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2fbf71"/>
      <stop offset="100%" stop-color="#c9a13a"/>
    </linearGradient>
    <linearGradient id="slabTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5fe6a0"/>
      <stop offset="100%" stop-color="#2fbf71"/>
    </linearGradient>
    <linearGradient id="goldTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e6c766"/>
      <stop offset="100%" stop-color="#c9a13a"/>
    </linearGradient>
    <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2fbf71" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#2fbf71" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <style>
    /* Position lives on the outer group's transform attribute; animation lives
       on an inner group. A CSS transform on the same element would override
       that attribute outright and collapse everything onto the origin. */
    .rise { animation: rise 3.6s ease-in-out infinite alternate; }
    .d1 { animation-delay: 0s; }
    .d2 { animation-delay: .5s; }
    .d3 { animation-delay: 1s; }
    .d4 { animation-delay: 1.5s; }
    .draw { stroke-dasharray: 640; stroke-dashoffset: 640; animation: draw 5s ease-out infinite; }
    .glow { animation: breathe 5s ease-in-out infinite; }
    .tick { animation: tick 5s ease-out infinite; }
    .ping { animation: ping 1.9s ease-out infinite; }
    .float { animation: float 6s ease-in-out infinite; }

    @keyframes rise    { from { transform: translateY(5px); } to { transform: translateY(-5px); } }
    @keyframes draw    { 0% { stroke-dashoffset: 640; } 60%,100% { stroke-dashoffset: 0; } }
    @keyframes breathe { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes tick    { 0% { transform: translateX(0); } 60%,100% { transform: translateX(430px); } }
    @keyframes ping    { 0% { r: 4; opacity: .9; } 70%,100% { r: 14; opacity: 0; } }
    @keyframes float   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

    @media (prefers-reduced-motion: reduce) {
      .rise, .draw, .glow, .tick, .ping, .float { animation: none; }
      .draw { stroke-dashoffset: 0; }
    }
  </style>

  <rect width="900" height="300" fill="url(#sky)"/>
  <g class="glow">
    <ellipse cx="200" cy="210" rx="180" ry="90" fill="#2fbf71" opacity=".07" filter="url(#soft)"/>
    <ellipse cx="720" cy="120" rx="170" ry="80" fill="#c9a13a" opacity=".06" filter="url(#soft)"/>
  </g>

  <!-- An order book stepping up, in isometric slabs -->
  <g transform="translate(70 228)">
    <g transform="translate(0 0)"><g class="rise d1">
      <path d="M0 0 L30 -17 L60 0 L30 17 Z" fill="url(#slabTop)"/>
      <path d="M0 0 L30 17 L30 46 L0 29 Z" fill="#1c7a47"/>
      <path d="M60 0 L30 17 L30 46 L60 29 Z" fill="#13603a"/>
    </g></g>
    <g transform="translate(66 -24)"><g class="rise d2">
      <path d="M0 0 L30 -17 L60 0 L30 17 Z" fill="url(#slabTop)"/>
      <path d="M0 0 L30 17 L30 52 L0 35 Z" fill="#1c7a47"/>
      <path d="M60 0 L30 17 L30 52 L60 35 Z" fill="#13603a"/>
    </g></g>
    <g transform="translate(132 -48)"><g class="rise d3">
      <path d="M0 0 L30 -17 L60 0 L30 17 Z" fill="url(#goldTop)"/>
      <path d="M0 0 L30 17 L30 58 L0 41 Z" fill="#9c7c2c"/>
      <path d="M60 0 L30 17 L30 58 L60 41 Z" fill="#7d6323"/>
    </g></g>
    <g transform="translate(198 -74)"><g class="rise d4">
      <path d="M0 0 L30 -17 L60 0 L30 17 Z" fill="url(#slabTop)"/>
      <path d="M0 0 L30 17 L30 66 L0 49 Z" fill="#1c7a47"/>
      <path d="M60 0 L30 17 L30 66 L60 49 Z" fill="#13603a"/>
    </g></g>
  </g>

  <!-- The desk's line, drawing itself, with the price running along it -->
  <g transform="translate(410 74)">
    <path d="M0 140 L54 122 L108 128 L162 100 L216 108 L270 70 L324 78 L378 40 L430 16 L430 160 L0 160 Z"
          fill="url(#areaFill)"/>
    <path class="draw" d="M0 140 L54 122 L108 128 L162 100 L216 108 L270 70 L324 78 L378 40 L430 16"
          fill="none" stroke="url(#brand)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g class="tick">
      <circle class="ping" cx="0" cy="140" r="4" fill="none" stroke="#2fbf71" stroke-width="2"/>
      <circle cx="0" cy="140" r="4.5" fill="#5fe6a0"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(70 74)">
    <g class="float">
      <text x="0" y="0" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif" font-size="36" font-weight="700" fill="#f2f5f3">EzyMap<tspan fill="#c9a13a">ALGO</tspan></text>
      <text x="2" y="27" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" letter-spacing="2.6" fill="#8b948f">SIGNALS &#183; MACRO &#183; AUTOPILOT</text>
    </g>
  </g>

  <rect x="0" y="295" width="900" height="5" fill="url(#brand)"/>
</svg>
