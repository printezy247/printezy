<line x1="120" y1="404" x2="392" y2="404" stroke="url(#fhe)" stroke-width="5" stroke-linecap="round" opacity=".7"/>
<rect class="fh-bar" x="162" y="368" width="36" height="28" rx="6" fill="url(#fhl)"/>
