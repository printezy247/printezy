<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="EzyMap fintech hero mark"><title>EzyMap</title><defs>
<linearGradient id="fhl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5be39a"/><stop offset=".45" stop-color="#2fbf71"/><stop offset="1" stop-color="#13804d"/></linearGradient>
<linearGradient id="fhd" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14935a"/><stop offset=".55" stop-color="#0f7a4a"/><stop offset="1" stop-color="#073d25"/></linearGradient>
<linearGradient id="fho" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7e3a0"/><stop offset=".4" stop-color="#e0bc63"/><stop offset="1" stop-color="#b38e2f"/></linearGradient>
<linearGradient id="fhm" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9a13a"/><stop offset=".6" stop-color="#8f7024"/><stop offset="1" stop-color="#5a4615"/></linearGradient>
<linearGradient id="fhe" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4dc93"/><stop offset=".35" stop-color="#e0bc63"/><stop offset=".7" stop-color="#c9a13a"/><stop offset="1" stop-color="#a3802a"/></linearGradient>
<radialGradient id="fhs" cx=".35" cy=".25" r=".6"><stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
<radialGradient id="fhh" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2fbf71" stop-opacity=".28"/><stop offset="1" stop-color="#2fbf71" stop-opacity="0"/></radialGradient>
</defs><style>
.fh-halo{animation:fhHalo 4s ease-in-out infinite;transform-box:view-box;transform-origin:256px 256px}
.fh-float{animation:fhFloat 6s ease-in-out infinite}
.fh-bar{animation:fhGrow 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.fh-bar2{animation-delay:.5s}
.fh-bar3{animation-delay:1s}
.fh-route{stroke-dasharray:1;stroke-dashoffset:1;animation:fhDraw 3.6s ease-in-out infinite}
.fh-tick{animation:fhPulse 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes fhHalo{0%,100%{transform:scale(.94);opacity:.6}50%{transform:scale(1.05);opacity:1}}
@keyframes fhFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes fhGrow{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
@keyframes fhDraw{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes fhPulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.fh-halo,.fh-float,.fh-bar,.fh-route,.fh-tick{animation:none}.fh-route{stroke-dashoffset:0}}
</style>
<circle class="fh-halo" cx="256" cy="200" r="190" fill="url(#fhh)"/>
