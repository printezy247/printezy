<polyline points="140,242 184,220 216,234 256,182 292,202 326,164" fill="none" stroke="#0a2a18" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" opacity=".35"/>
<polyline points="140,236 184,214 216,228 256,176 292,196 326,158" fill="none" stroke="url(#fhe)" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="326" cy="158" r="13" fill="#0a2a18" stroke="url(#fhe)" stroke-width="6"/>
<circle cx="140" cy="236" r="7" fill="url(#fhe)"/>
