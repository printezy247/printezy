<line x1="256" y1="44" x2="256" y2="316" stroke="#9af0c0" stroke-width="2" opacity=".45"/><path d="M50 262 A206 58 0 0 0 462 262" fill="none" stroke="url(#medge)" stroke-width="7"/><circle cx="420" cy="296" r="9" fill="#f4dc93"/><circle cx="420" cy="296" r="18" fill="#f4dc93" opacity=".2"/></g></g>
