<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="EzyMap hero mark"><title>EzyMap</title><defs>
<linearGradient id="mgl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5be39a"/><stop offset=".45" stop-color="#2fbf71"/><stop offset="1" stop-color="#13804d"/></linearGradient>
<linearGradient id="mgd" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14935a"/><stop offset=".55" stop-color="#0f7a4a"/><stop offset="1" stop-color="#073d25"/></linearGradient>
<linearGradient id="mol" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7e3a0"/><stop offset=".4" stop-color="#e0bc63"/><stop offset="1" stop-color="#b38e2f"/></linearGradient>
<linearGradient id="mod" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9a13a"/><stop offset=".6" stop-color="#8f7024"/><stop offset="1" stop-color="#5a4615"/></linearGradient>
<linearGradient id="medge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4dc93"/><stop offset=".35" stop-color="#e0bc63"/><stop offset=".7" stop-color="#c9a13a"/><stop offset="1" stop-color="#a3802a"/></linearGradient>
<radialGradient id="mspec" cx=".35" cy=".25" r=".6"><stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient><linearGradient id="mground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121715"/><stop offset="1" stop-color="#0a0c0b"/></linearGradient><radialGradient id="mhalo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2fbf71" stop-opacity=".28"/><stop offset="1" stop-color="#2fbf71" stop-opacity="0"/></radialGradient><linearGradient id="sweepg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".14"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs><style>
.ezm-h-float{animation:ezmHFloat 6s ease-in-out infinite;transform-box:view-box;transform-origin:center}
.ezm-h-ring{animation:ezmHSpin 16s linear infinite;transform-box:view-box;transform-origin:320px 330px}
.ezm-h-ring2{animation:ezmHSpin2 22s linear infinite;transform-box:view-box;transform-origin:320px 330px}
.ezm-h-pulse{animation:ezmHPulse 3.2s ease-out infinite;transform-box:view-box;transform-origin:320px 320px}
.ezm-h-sweep{animation:ezmHSweep 7s ease-in-out infinite}
@keyframes ezmHFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes ezmHSpin{to{transform:rotate(360deg)}}
@keyframes ezmHSpin2{to{transform:rotate(-360deg)}}
@keyframes ezmHPulse{0%{transform:scale(.82);opacity:.55}100%{transform:scale(1.18);opacity:0}}
@keyframes ezmHSweep{0%{transform:translateX(-160px)}55%,100%{transform:translateX(800px)}}
@media (prefers-reduced-motion:reduce){.ezm-h-float,.ezm-h-ring,.ezm-h-ring2,.ezm-h-pulse,.ezm-h-sweep{animation:none}}
</style>
<circle class="ezm-h-pulse" cx="320" cy="320" r="185" fill="url(#mhalo)"/>
<ellipse class="ezm-h-ring2" cx="320" cy="330" rx="252" ry="76" fill="none" stroke="#2fbf71" stroke-width="3" stroke-dasharray="4 14" opacity=".5"/>
